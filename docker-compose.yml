version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shop_management_db
    environment:
      POSTGRES_DB: shop_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop_network

  backend:
    build: ./backend
    container_name: shop_management_backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - shop_network

  frontend:
    build: ./frontend
    container_name: shop_management_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - shop_network

volumes:
  postgres_data:

networks:
  shop_network:
    driver: bridge
